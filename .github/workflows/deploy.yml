name: Tests, and the handover at the old address

# The app is served by Vercel at https://retailor.utpaldas.com (vercel.json).
# GitHub Pages keeps the old address, utpaldaslabs.github.io/Retailor/, alive
# only to carry each visitor's saved CV over to it: see handover/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  handover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the handover site
        run: |
          mkdir site
          # index.html answers the old start URL; 404.html answers every old
          # deep link; sw.js replaces the old precache at the same URL.
          cp handover/index.html site/index.html
          cp handover/index.html site/404.html
          cp handover/sw.js site/sw.js
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: handover
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
